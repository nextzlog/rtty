[workspace]
members = ["lib", "ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nextzlog/rtty"

[workspace.dependencies]
rtty = { path = "lib" }
rustfft = "6.4"
egui = "0.37"
egui_kittest = "0.37"
egui_system_font_provider = "0.37"
cpal = "0.18"
hound = "3.5"
rfd = "0.17"
eframe = { version = "0.37", features = ["persistence"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
